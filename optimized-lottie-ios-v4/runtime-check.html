<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartHue · dotLottie runtime check</title><style>body{margin:0;padding:24px;background:#0c0c0c;color:#eee;font:14px system-ui}main{max-width:800px;margin:auto}canvas{display:block;width:min(100%,393px);aspect-ratio:393/326;margin:24px auto}select,button,a{padding:10px;border-radius:8px;background:#242424;color:#eee;border:1px solid #444}p{line-height:1.5;color:#bbb}.controls{display:flex;gap:8px;flex-wrap:wrap}#error{color:#ffa36b}</style><main><h2>SmartHue · LottieFiles runtime</h2><p>File .lottie v4 thật · dotlottie-web 0.77.1 · không phải phép đo native iOS.</p><div class="controls"><select id="clip"><option value="01-tim-den">1 · Tìm đèn</option><option value="02-tim-thay">2 · Tìm thấy</option><option value="03-dang-ket-noi">3 · Đang kết nối</option><option value="04-thanh-cong">4 · Thành công</option><option value="05-tim-thay-den-ket-noi">5 · Nối tìm thấy → kết nối</option><option value="07-no-light-found">7 · Không tìm thấy</option><option value="08-connection-timeout">8 · Timeout</option></select><select id="scale"><option value="1.5">Render 1.5x</option><option value="2" selected>Render 2x</option><option value="3">Render 3x</option></select><button id="pause">Tạm dừng</button></div><canvas width="786" height="652"></canvas><p id="status">Đang tải runtime…</p><p id="error"></p><p>Đo ở 3x và 2x để so độ mượt và độ nét. Render 2x giảm lượng pixel nhưng có thể làm mềm nét trên màn hình 3x.</p><p><a href="index.html">Preview full app</a> <a href="smarthue-lottie-ios-candidate-v4.zip">Tải bộ Lottie</a></p></main><script type="module">
import {DotLottie} from './runtime/dotlottie.mjs';
DotLottie.setWasmUrl('./runtime/player.wasm');
let player,epoch=0,frames=[],last=null;const clip=document.querySelector('#clip'),scale=document.querySelector('#scale'),canvas=document.querySelector('canvas'),status=document.querySelector('#status'),error=document.querySelector('#error');
window.runtimeErrors=[];window.runtimeLoaded=false;
async function load(){const ticket=++epoch;window.runtimeLoaded=false;error.textContent='';status.textContent='Đang tải animation…';frames=[];last=null;if(player)player.destroy();player=new DotLottie({canvas,src:'./animations/'+clip.value+'.lottie',autoplay:true,loop:true,speed:1,useFrameInterpolation:true,renderConfig:{devicePixelRatio:Number(scale.value)}});window.runtimePlayer=player;player.addEventListener('load',()=>{if(ticket!==epoch)return;window.runtimeLoaded=true;status.textContent=`60 FPS metadata · Buffer ${canvas.width}×${canvas.height} · Loop toàn clip`;document.querySelector('#pause').textContent='Tạm dừng'});player.addEventListener('loadError',e=>{error.textContent='Không tải được animation';runtimeErrors.push(String(e.error||e.message||e))})}
clip.onchange=load;scale.onchange=load;document.querySelector('#pause').onclick=()=>{if(!player)return;if(player.isPlaying){player.pause();document.querySelector('#pause').textContent='Phát tiếp'}else{player.play();document.querySelector('#pause').textContent='Tạm dừng'}};
load();function tick(t){if(last!==null&&window.runtimeLoaded&&player.isPlaying)frames.push(t-last);last=t;if(frames.length>=60){const average=frames.reduce((a,b)=>a+b,0)/frames.length;status.textContent=`RAF ~${(1000/average).toFixed(1)} FPS · Buffer ${canvas.width}×${canvas.height} · Loop toàn clip`;frames=[]}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
